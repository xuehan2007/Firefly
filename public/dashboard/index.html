<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>博客管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus/dist/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue/dist/index.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; }
    #app { min-height: 100vh; }
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .login-box {
      width: 400px;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .login-title { text-align: center; font-size: 24px; font-weight: 600; margin-bottom: 30px; color: #303133; }
    .login-subtitle { text-align: center; color: #909399; margin-bottom: 30px; font-size: 14px; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: #001529;
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .sidebar-logo {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 600;
      border-bottom: 1px solid #1f2d3d;
    }
    .sidebar-menu { flex: 1; padding: 12px 0; }
    .menu-item {
      padding: 12px 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
      color: #bfcbd9;
      font-size: 14px;
    }
    .menu-item:hover { background: #1890ff20; color: #fff; }
    .menu-item.active { background: #1890ff; color: #fff; }
    .menu-item .el-icon { font-size: 18px; }
    .sidebar-footer { padding: 16px 24px; border-top: 1px solid #1f2d3d; font-size: 12px; color: #909399; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .header {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid #e4e7ed;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }
    .header-title { font-size: 18px; font-weight: 500; color: #303133; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .content { flex: 1; padding: 24px; overflow-y: auto; }
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .stat-card {
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .stat-card .label { color: #909399; font-size: 14px; margin-bottom: 12px; }
    .stat-card .value { font-size: 32px; font-weight: 600; color: #303133; }
    .stat-card .icon-wrap { display: flex; justify-content: space-between; align-items: center; }
    .stat-card .el-icon { font-size: 40px; color: #409eff; }
    .quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
    .action-card {
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: all 0.2s;
    }
    .action-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); transform: translateY(-2px); }
    .action-card h4 { margin-bottom: 8px; color: #303133; }
    .action-card p { color: #909399; font-size: 13px; }
    .editor-toolbar {
      display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
    }
    .md-editor {
      width: 100%;
      min-height: 500px;
      padding: 16px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 14px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      resize: vertical;
      line-height: 1.6;
    }
    .md-editor:focus { outline: none; border-color: #409eff; }
    .fm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 登录页 -->
    <div v-if="!token" class="login-container">
      <div class="login-box">
        <div class="login-title">🐝 博客管理后台</div>
        <div class="login-subtitle">鹅鹅鹅123的博客</div>
        <el-form @submit.prevent="login">
          <el-form-item>
            <el-input v-model="password" type="password" placeholder="请输入管理员密码" size="large" show-password />
          </el-form-item>
          <el-button type="primary" size="large" style="width:100%" @click="login" :loading="logging">登录</el-button>
        </el-form>
      </div>
    </div>

    <!-- 主界面 -->
    <div v-else class="layout">
      <div class="sidebar">
        <div class="sidebar-logo">🐝 管理后台</div>
        <div class="sidebar-menu">
          <div class="menu-item" :class="{active: page==='dashboard'}" @click="page='dashboard'">
            <el-icon><Monitor /></el-icon> 仪表盘
          </div>
          <div class="menu-item" :class="{active: page==='posts'}" @click="loadPosts">
            <el-icon><Document /></el-icon> 博客文章
          </div>
          <div class="menu-item" @click="goBlog">
            <el-icon><Link /></el-icon> 查看博客
          </div>
        </div>
        <div class="sidebar-footer">
          <el-button size="small" text @click="logout" style="color:#bfcbd9">退出登录</el-button>
        </div>
      </div>

      <div class="main">
        <div class="header">
          <div class="header-title">{{ pageTitle }}</div>
          <div class="header-right">
            <el-button type="primary" @click="newPost" v-if="page==='posts'">+ 新建文章</el-button>
          </div>
        </div>

        <div class="content">
          <!-- 仪表盘 -->
          <div v-if="page==='dashboard'">
            <el-alert title="欢迎回来，这里是你的博客管理中心。" type="info" :closable="false" style="margin-bottom:24px" />
            <div class="stat-cards">
              <div class="stat-card">
                <div class="icon-wrap">
                  <div>
                    <div class="label">博客文章</div>
                    <div class="value">{{ stats.totalPosts || 0 }}</div>
                  </div>
                  <el-icon><Document /></el-icon>
                </div>
              </div>
              <div class="stat-card">
                <div class="icon-wrap">
                  <div>
                    <div class="label">已发布文章</div>
                    <div class="value">{{ stats.published || 0 }}</div>
                  </div>
                  <el-icon><CircleCheck /></el-icon>
                </div>
              </div>
              <div class="stat-card">
                <div class="icon-wrap">
                  <div>
                    <div class="label">草稿</div>
                    <div class="value">{{ stats.drafts || 0 }}</div>
                  </div>
                  <el-icon><EditPen /></el-icon>
                </div>
              </div>
              <div class="stat-card">
                <div class="icon-wrap">
                  <div>
                    <div class="label">置顶文章</div>
                    <div class="value">{{ stats.pinned || 0 }}</div>
                  </div>
                  <el-icon><Top /></el-icon>
                </div>
              </div>
            </div>
            <h3 style="margin-bottom:16px;color:#303133">快捷操作</h3>
            <div class="quick-actions">
              <div class="action-card" @click="newPost">
                <h4>📝 发布说说</h4>
                <p>写一篇新博客文章</p>
              </div>
              <div class="action-card" @click="loadPosts">
                <h4>📚 文章管理</h4>
                <p>查看和管理所有文章</p>
              </div>
              <div class="action-card" @click="goBlog">
                <h4>🌐 查看博客</h4>
                <p>打开博客前台页面</p>
              </div>
              <div class="action-card" @click="loadStats">
                <h4>📊 刷新统计</h4>
                <p>重新加载统计数据</p>
              </div>
            </div>
          </div>

          <!-- 文章列表 -->
          <div v-if="page==='posts'">
            <el-table :data="posts" v-loading="loadingPosts" stripe>
              <el-table-column prop="title" label="标题" min-width="200" />
              <el-table-column prop="category" label="分类" width="120" />
              <el-table-column prop="published" label="发布日期" width="140" />
              <el-table-column label="状态" width="100">
                <template #default="{row}">
                  <el-tag v-if="row.draft" type="info" size="small">草稿</el-tag>
                  <el-tag v-else type="success" size="small">已发布</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="置顶" width="80">
                <template #default="{row}">
                  <el-tag v-if="row.pinned" type="warning" size="small">置顶</el-tag>
                </template>
              </el-table-column>
              <el-table-column label="操作" width="180" fixed="right">
                <template #default="{row}">
                  <el-button size="small" @click="editPost(row)">编辑</el-button>
                  <el-button size="small" type="danger" @click="deletePost(row)">删除</el-button>
                </template>
              </el-table-column>
            </el-table>
          </div>

          <!-- 文章编辑器 -->
          <div v-if="page==='editor'">
            <div class="editor-toolbar">
              <el-button @click="page='posts'">← 返回列表</el-button>
              <el-button type="primary" @click="savePost" :loading="saving">保存文章</el-button>
            </div>
            <el-card style="margin-bottom:16px">
              <template #header><strong>文章信息</strong></template>
              <div class="fm-grid">
                <el-form-item label="标题">
                  <el-input v-model="fm.title" />
                </el-form-item>
                <el-form-item label="分类">
                  <el-input v-model="fm.category" />
                </el-form-item>
                <el-form-item label="发布日期">
                  <el-date-picker v-model="fm.published" type="date" value-format="YYYY-MM-DD" style="width:100%" />
                </el-form-item>
                <el-form-item label="标签">
                  <el-input v-model="fm.tagsStr" placeholder="用逗号分隔" />
                </el-form-item>
                <el-form-item label="描述">
                  <el-input v-model="fm.description" type="textarea" :rows="2" />
                </el-form-item>
                <el-form-item label="封面图">
                  <el-input v-model="fm.image" placeholder="图片路径或URL" />
                </el-form-item>
                <el-form-item label="slug">
                  <el-input v-model="fm.slug" />
                </el-form-item>
                <el-form-item label="选项">
                  <el-checkbox v-model="fm.draft">草稿</el-checkbox>
                  <el-checkbox v-model="fm.pinned">置顶</el-checkbox>
                </el-form-item>
              </div>
            </el-card>
            <el-card>
              <template #header><strong>正文内容（Markdown）</strong></template>
              <textarea class="md-editor" v-model="body" placeholder="在这里写 Markdown 内容..."></textarea>
            </el-card>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
  <script>
    const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

    const app = createApp({
      setup() {
        const token = ref(localStorage.getItem('admin_token') || '');
        const password = ref('');
        const logging = ref(false);
        const page = ref('dashboard');
        const posts = ref([]);
        const loadingPosts = ref(false);
        const saving = ref(false);
        const stats = ref({});

        // 编辑器状态
        const editingFilename = ref('');
        const editingSha = ref('');
        const fm = reactive({
          title: '', published: '', description: '', tags: [], category: '',
          image: '', slug: '', draft: false, pinned: false, tagsStr: ''
        });
        const body = ref('');

        const pageTitle = computed(() => {
          return { dashboard: '仪表盘', posts: '文章管理', editor: '编辑文章' }[page.value] || '管理后台';
        });

        async function login() {
          logging.value = true;
          try {
            const res = await fetch('/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: password.value })
            });
            const data = await res.json();
            if (res.ok) {
              token.value = data.token;
              localStorage.setItem('admin_token', data.token);
              password.value = '';
              loadStats();
            } else {
              ElementPlus.ElMessage.error(data.error || '登录失败');
            }
          } catch (e) {
            ElementPlus.ElMessage.error('网络错误');
          } finally {
            logging.value = false;
          }
        }

        function logout() {
          token.value = '';
          localStorage.removeItem('admin_token');
        }

        async function api(url, options = {}) {
          const res = await fetch(url, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token.value}`,
              ...(options.headers || {})
            }
          });
          const data = await res.json().catch(() => ({}));
          if (res.status === 401) { logout(); ElementPlus.ElMessage.error('登录已过期'); }
          if (!res.ok) throw new Error(data.error || '请求失败');
          return data;
        }

        async function loadStats() {
          try {
            stats.value = await api('/api/admin/stats');
          } catch (e) {}
        }

        async function loadPosts() {
          page.value = 'posts';
          loadingPosts.value = true;
          try {
            const list = await api('/api/admin/posts');
            posts.value = list;
            // 计算统计
            stats.value = {
              totalPosts: list.length,
              published: list.filter(p => !p.draft).length,
              drafts: list.filter(p => p.draft).length,
              pinned: list.filter(p => p.pinned).length,
            };
          } catch (e) {
            ElementPlus.ElMessage.error(e.message);
          } finally {
            loadingPosts.value = false;
          }
        }

        function newPost() {
          editingFilename.value = '';
          editingSha.value = '';
          Object.assign(fm, {
            title: '', published: new Date().toISOString().slice(0,10),
            description: '', tags: [], category: '随笔', image: '', slug: '',
            draft: false, pinned: false, tagsStr: ''
          });
          body.value = '';
          page.value = 'editor';
        }

        async function editPost(row) {
          try {
            const data = await api(`/api/admin/post/${encodeURIComponent(row.filename)}`);
            editingFilename.value = data.filename;
            editingSha.value = data.sha;
            // 解析 frontmatter
            const match = data.content.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
            const fmData = {};
            if (match) {
              match[1].split('\n').forEach(line => {
                const m = line.match(/^(\w+):\s*(.*)$/);
                if (m) {
                  let v = m[2].trim();
                  if (v.startsWith('[') && v.endsWith(']')) {
                    v = v.slice(1,-1).split(',').map(s => s.trim().replace(/^["']|["']$/g,''));
                  }
                  if (v === 'true') v = true;
                  if (v === 'false') v = false;
                  fmData[m[1]] = v;
                }
              });
              body.value = match[2];
            } else {
              body.value = data.content;
            }
            Object.assign(fm, {
              title: fmData.title || '',
              published: fmData.published || '',
              description: fmData.description || '',
              tags: Array.isArray(fmData.tags) ? fmData.tags : [],
              category: fmData.category || '',
              image: fmData.image || '',
              slug: fmData.slug || '',
              draft: fmData.draft === true,
              pinned: fmData.pinned === true,
              tagsStr: Array.isArray(fmData.tags) ? fmData.tags.join(', ') : ''
            });
            page.value = 'editor';
          } catch (e) {
            ElementPlus.ElMessage.error(e.message);
          }
        }

        async function deletePost(row) {
          try {
            await ElementPlus.ElMessageBox.confirm(`确定删除文章 "${row.title}" 吗？`, '提示', { type: 'warning' });
            await api(`/api/admin/post/${encodeURIComponent(row.filename)}`, {
              method: 'DELETE',
              body: JSON.stringify({ sha: row.sha })
            });
            ElementPlus.ElMessage.success('删除成功');
            loadPosts();
          } catch (e) {
            if (e !== 'cancel') ElementPlus.ElMessage.error(e.message);
          }
        }

        async function savePost() {
          if (!fm.title) { ElementPlus.ElMessage.warning('请填写标题'); return; }
          saving.value = true;
          try {
            const tags = fm.tagsStr ? fm.tagsStr.split(',').map(s => s.trim()).filter(Boolean) : [];
            // 生成 frontmatter
            let fmStr = '---\n';
            fmStr += `title: ${fm.title}\n`;
            fmStr += `published: ${fm.published}\n`;
            if (fm.description) fmStr += `description: ${fm.description}\n`;
            if (tags.length) fmStr += `tags: [${tags.map(t => `"${t}"`).join(', ')}]\n`;
            if (fm.category) fmStr += `category: ${fm.category}\n`;
            if (fm.image) fmStr += `image: ${fm.image}\n`;
            if (fm.slug) fmStr += `slug: ${fm.slug}\n`;
            if (fm.draft) fmStr += `draft: true\n`;
            if (fm.pinned) fmStr += `pinned: true\n`;
            fmStr += '---\n';
            const content = fmStr + body.value;

            let filename = editingFilename.value;
            if (!filename) {
              const slug = fm.slug || fm.title.toLowerCase().replace(/\s+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '');
              filename = `${fm.published || new Date().toISOString().slice(0,10)}-${slug}.md`;
            }

            if (editingSha.value) {
              await api(`/api/admin/post/${encodeURIComponent(filename)}`, {
                method: 'PUT',
                body: JSON.stringify({ content, sha: editingSha.value })
              });
            } else {
              await api('/api/admin/posts', {
                method: 'POST',
                body: JSON.stringify({ filename, content })
              });
            }
            ElementPlus.ElMessage.success('保存成功！Vercel 将自动重新部署博客。');
            setTimeout(() => loadPosts(), 1000);
          } catch (e) {
            ElementPlus.ElMessage.error(e.message);
          } finally {
            saving.value = false;
          }
        }

        function goBlog() { window.open('/', '_blank'); }

        onMounted(() => {
          if (token.value) loadStats();
        });

        return {
          token, password, logging, login, logout,
          page, pageTitle, posts, loadingPosts, stats, loadStats, loadPosts,
          editingFilename, fm, body, saving,
          newPost, editPost, deletePost, savePost, goBlog
        };
      }
    });

    app.use(ElementPlus);
    for (const [key, comp] of Object.entries(ElementPlusIconsVue)) {
      app.component(key, comp);
    }
    app.mount('#app');
  </script>
</body>
</html>
