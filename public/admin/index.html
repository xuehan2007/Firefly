<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容管理 - 鹅鹅鹅123的博客</title>
  </head>
  <body>
    <script>
      // 在加载 Decap CMS 之前，动态生成配置 URL
      // 将 base_url 替换为当前部署域名，使 OAuth 回调在任何域名下都能工作
      (async function () {
        try {
          const res = await fetch("/admin/config.yml");
          if (!res.ok) throw new Error("HTTP " + res.status);
          let config = await res.text();

          // 替换 base_url 为当前站点域名
          config = config.replace(
            /base_url:.*$/m,
            "base_url: " + window.location.origin,
          );

          // 用 Blob URL 作为配置地址，Decap CMS 会像加载普通 config.yml 一样解析它
          const blob = new Blob([config], { type: "text/yaml" });
          window.CMS_CONFIG_URL = URL.createObjectURL(blob);
        } catch (err) {
          document.body.innerHTML =
            "<p style='text-align:center;margin-top:100px;color:#fff'>" +
            "配置加载失败: " + err.message + "</p>";
        }
      })();
    </script>

    <!-- Decap CMS 会从 window.CMS_CONFIG_URL 加载配置 -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
